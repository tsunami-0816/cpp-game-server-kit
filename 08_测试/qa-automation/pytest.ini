[pytest]
# step8 全量测试 pytest 四层框架配置
addopts = -v --alluredir=reports/allure-results --clean-alluredir
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    p0: P0 主链路用例（纳入 p0_cases.json 冒烟回归）
    p1: P1 核心反向/边界用例
    p2: P2 一般场景（已知 deferred bug 以 xfail 标注）
    l1: L1 单元层
    l2: L2 接口集成层
    l3: L3 中间件集成层
    l4: L4 端到端层
