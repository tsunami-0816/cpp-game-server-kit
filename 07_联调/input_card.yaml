# 核心端到端链路（联调清单逐条覆盖）
chains:
  - id: L1-login
    desc: TCP 8001 发 LoginReq → MySQL 查 user → sha256(salt+pwd) 比对 → Redis SET session:{uid} TTL 7200 → LoginRsp(code=0,token,uid)
    expect: code=0；token 64 位；Redis 可读 session:{uid}
  - id: L2-create-room
    desc: KCP 8002 type=1 CreateRoomReq(token,uid) → checkToken 比对 Redis session:{uid} → type=2 CreateRoomRsp
    expect: code=0，room_id 自增（起步 1000）
  - id: L3-join-room
    desc: type=3 JoinRoomReq(token,room_id,uid) → 校验 token/房间存在/未满员 → type=4 JoinRoomRsp(members)
    expect: code=0，members 含双方 uid
  - id: L4-frame-sync
    desc: type=5 FrameInput(room_id,uid,input) 入房间历史(最近 100 条) → 100ms tick 广播 type=6 FrameBroadcast(frame_no,inputs)
    expect: 房间成员收到广播段，inputs 与上报一致
  - id: L5-rejoin
    desc: 断线后 type=7 RejoinRoomReq(token,room_id,uid) → type=8 RejoinRoomRsp(frame_no,history)
    expect: code=0，frame_no 连续，history 为未广播积压帧
  - id: L6-errors
    desc: 异常分支：伪造/空 token→1003；不存在房间→2001；不存在用户→1001；密码错→1002；满员→2002
    expect: 错误码与契约 §5.3 一致（见契约记录 §4）

